name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp script.js www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize Capacitor
        run: |
          npx cap init WADAAG com.wadaag.app --web-dir=www

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android app name
        run: |
          cd android/app/src/main/res/values
          cat > strings.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">WADAAG</string>
              <string name="title_activity_main">WADAAG</string>
              <string name="package_name">com.wadaag.app</string>
              <string name="custom_url_scheme">com.wadaag.app</string>
          </resources>
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon || echo "Release build failed (signing required) — using debug only"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wadaag-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: wadaag-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
