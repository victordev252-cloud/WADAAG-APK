name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK (pre-installed)
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || true
          ls $ANDROID_HOME/platforms || true
          ls $ANDROID_HOME/build-tools || true

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp script.js www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize Capacitor
        run: |
          npx cap init WADAAG com.wadaag.app --web-dir=www

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android app name
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">WADAAG</string>
              <string name="title_activity_main">WADAAG</string>
              <string name="package_name">com.wadaag.app</string>
              <string name="custom_url_scheme">com.wadaag.app</string>
          </resources>
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wadaag-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
